<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProMapper — 프로젝터 매핑</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="toolbar">
  <div class="brand">Pro<span>Mapper</span></div>

  <div class="mode-tabs">
    <button id="modeOutput" class="tab active" title="출력(투사 위치) 편집">출력 편집</button>
    <button id="modeInput" class="tab" title="입력(소스 영역) 편집">입력 편집</button>
  </div>

  <div class="spacer"></div>

  <label class="tb-field">출력 해상도
    <select id="resSelect">
      <option value="1280x720">1280 × 720</option>
      <option value="1920x1080" selected>1920 × 1080</option>
      <option value="2560x1440">2560 × 1440</option>
      <option value="3840x2160">3840 × 2160</option>
    </select>
  </label>

  <button id="btnFit" title="편집 뷰를 창에 맞춤 (단축키 F)">화면 맞춤</button>
  <button id="btnOutput" class="primary" title="프로젝터로 보낼 별도 출력 창을 엽니다">프로젝터 출력 창</button>

  <div class="divider"></div>

  <button id="btnSave" title="프로젝트를 JSON 파일로 저장">저장</button>
  <button id="btnLoad" title="저장한 프로젝트 불러오기">불러오기</button>
  <input type="file" id="projectFile" accept=".json,application/json" hidden>
</header>

<div id="main">
  <aside id="left">
    <section class="panel">
      <h3>미디어 <button id="btnAddMedia" class="mini" title="이미지/비디오 파일 추가">+ 파일</button></h3>
      <input type="file" id="mediaFile" accept="image/*,video/*" hidden>
      <div id="mediaList" class="list"></div>
    </section>

    <section class="panel">
      <h3>서피스
        <span>
          <button id="btnAddQuad" class="mini" title="코너핀 쿼드 서피스 추가">+ 쿼드</button>
          <button id="btnAddMesh" class="mini" title="그리드 워프 메시 서피스 추가">+ 메시</button>
        </span>
      </h3>
      <div id="surfaceList" class="list"></div>
    </section>
  </aside>

  <div id="editor">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <aside id="right">
    <section class="panel" id="props" hidden>
      <h3>서피스 속성</h3>

      <label class="field">이름
        <input type="text" id="p_name">
      </label>

      <label class="field">미디어
        <select id="p_media"></select>
      </label>

      <div class="field" id="meshRow" hidden>
        <span>메시 격자</span>
        <div class="inline">
          <input type="number" id="p_cols" min="2" max="12" step="1"> ×
          <input type="number" id="p_rows" min="2" max="12" step="1">
        </div>
      </div>

      <label class="field slider">불투명도 <output id="o_opacity"></output>
        <input type="range" id="p_opacity" min="0" max="1" step="0.01">
      </label>
      <label class="field slider">밝기 <output id="o_brightness"></output>
        <input type="range" id="p_brightness" min="0" max="2" step="0.01">
      </label>
      <label class="field slider">대비 <output id="o_contrast"></output>
        <input type="range" id="p_contrast" min="0" max="2" step="0.01">
      </label>
      <label class="field slider">채도 <output id="o_saturation"></output>
        <input type="range" id="p_saturation" min="0" max="2" step="0.01">
      </label>
      <label class="field">틴트
        <input type="color" id="p_tint">
      </label>

      <h4>엣지 블렌딩</h4>
      <label class="field slider">왼쪽 <output id="o_blendL"></output>
        <input type="range" id="p_blendL" min="0" max="0.5" step="0.005">
      </label>
      <label class="field slider">오른쪽 <output id="o_blendR"></output>
        <input type="range" id="p_blendR" min="0" max="0.5" step="0.005">
      </label>
      <label class="field slider">위 <output id="o_blendT"></output>
        <input type="range" id="p_blendT" min="0" max="0.5" step="0.005">
      </label>
      <label class="field slider">아래 <output id="o_blendB"></output>
        <input type="range" id="p_blendB" min="0" max="0.5" step="0.005">
      </label>

      <div class="btn-row">
        <button id="btnResetDst" title="출력 코너를 사각형으로 초기화">출력 초기화</button>
        <button id="btnResetSrc" title="입력 영역을 전체로 초기화">입력 초기화</button>
      </div>
      <div class="btn-row">
        <button id="btnDelete" class="danger">서피스 삭제</button>
      </div>
    </section>

    <section class="panel hint">
      <h3>사용법</h3>
      <ul>
        <li>서피스를 클릭해 선택, 코너를 드래그해 워핑</li>
        <li>내부 드래그로 이동, 방향키 미세 이동 (Shift = 10px)</li>
        <li>휠 = 줌, 휠 클릭/Space 드래그 = 이동</li>
        <li><b>입력 편집</b> 탭에서 소스의 사용 영역 지정</li>
        <li>출력 창에서 더블클릭 = 전체화면</li>
      </ul>
    </section>
  </aside>
</div>

<footer id="status">
  <span id="statusRes"></span>
  <span id="statusMouse"></span>
  <span class="spacer"></span>
  <span id="statusSel"></span>
</footer>

<script src="js/homography.js"></script>
<script src="js/patterns.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
