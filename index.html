<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ProMap Sim — 프로젝션 매핑 3D 시뮬레이터</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="btn-panel-left" class="icon-btn mobile-only" title="프로젝터 / 환경 패널 열기">☰</button>
      <div class="brand">ProMap<span>Sim</span></div>

      <div class="tb-group">
        <label>환경</label>
        <select id="env-preset">
          <option value="room">실내 벽면</option>
          <option value="facade">건물 파사드</option>
          <option value="curved">곡면 스크린</option>
          <option value="stage">무대 + 오브젝트</option>
        </select>
      </div>

      <div class="tb-group">
        <label>표시 모드</label>
        <div class="segmented" id="view-mode">
          <button data-mode="0" class="active" title="프로젝터가 실제로 투사하는 영상 미리보기">투사</button>
          <button data-mode="1" title="몇 대의 프로젝터가 각 영역을 덮는지 표시 (녹색 1대 / 황색 2대 / 적색 3대 이상)">커버리지</button>
          <button data-mode="2" title="표면 조도(lux) 히트맵">조도</button>
        </div>
      </div>

      <div class="tb-group">
        <label>테스트 패턴</label>
        <select id="pattern-select">
          <option value="0">그리드</option>
          <option value="1">전체 화이트</option>
          <option value="2">컬러바</option>
        </select>
      </div>

      <div class="tb-group">
        <label class="chk"><input type="checkbox" id="blend-toggle" /> 에지 블렌드</label>
        <input type="range" id="blend-ramp" min="2" max="30" value="12" title="블렌드 램프 폭 (%)" />
      </div>

      <div class="tb-spacer"></div>

      <button id="btn-assistant" class="primary" title="투사면 크기와 목표 품질로 필요 대수/배치를 자동 산출">⚙ 세팅 도우미</button>
      <button id="btn-save" title="프로젝트를 JSON 파일로 저장">저장</button>
      <button id="btn-load" title="JSON 프로젝트 불러오기">불러오기</button>
      <button id="btn-reset" title="기본 장면으로 초기화">초기화</button>
      <button id="btn-panel-right" class="icon-btn mobile-only" title="선택 프로젝터 속성 열기">속성</button>
      <input type="file" id="file-input" accept=".json" hidden />
    </header>

    <aside id="left-panel">
      <div class="panel-section">
        <div class="panel-title">
          프로젝터
          <button id="btn-add-projector" class="mini primary" title="프로젝터 추가 (기본 기종)">＋ 추가</button>
        </div>
        <ul id="projector-list"></ul>
      </div>
      <div class="panel-section" id="env-panel">
        <div class="panel-title">환경 설정</div>
        <div id="env-controls"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">도움말</div>
        <div class="help-text">
          <b>마우스</b> 좌drag 회전 · 휠 줌 · 우drag 이동<br/>
          <b>W</b> 이동 기즈모 · <b>E</b> 회전 기즈모<br/>
          <b>F</b> 선택 프로젝터 포커스 · <b>Del</b> 삭제<br/>
          <b>Ctrl+D</b> 복제 · 클릭으로 프로젝터 선택
        </div>
      </div>
    </aside>

    <main id="viewport">
      <div id="viewport-tools">
        <button id="vt-move" class="active" title="이동 기즈모 (W)">이동</button>
        <button id="vt-rotate" title="회전 기즈모 (E)">회전</button>
        <button id="vt-aim" title="선택 프로젝터를 주 투사면 중심으로 정조준">정조준</button>
      </div>
    </main>

    <div id="drawer-backdrop" hidden></div>

    <aside id="right-panel">
      <div id="props-empty" class="props-empty">
        프로젝터를 선택하면<br/>속성이 표시됩니다
      </div>
      <div id="props-body" hidden></div>
    </aside>

    <footer id="status-bar">
      <span id="metric-summary">프로젝터 0대</span>
      <span id="metric-detail"></span>
    </footer>

    <div id="modal-backdrop" hidden>
      <div id="assistant-modal">
        <div class="modal-title">세팅 도우미 — 자동 대수/배치 산출</div>
        <div class="modal-body" id="assistant-body"></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
